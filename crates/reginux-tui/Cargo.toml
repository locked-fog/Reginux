[package]
name = "reginux-tui"
version = "0.4.0"
edition = "2021"
description = "Ratatui frontend for Reginux"
license = "MIT"
autobins = false

[[bin]]
name = "reginux"
path = "src/main.rs"

[[bin]]
name = "reginux-helper"
path = "src/bin/reginux-helper.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reginux-core = { path = "../reginux-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
