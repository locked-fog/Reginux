[package]
name = "reginux-core"
version = "1.1.0"
edition = "2021"
description = "Core configuration model and transaction engine for Reginux"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
toml = "0.8"
crossterm = "0.28"
libc = "0.2"
glob = "0.3"
mlua = { version = "0.11.4", features = ["anyhow", "lua54", "vendored", "serialize"] }
sha2 = "0.10"
base64 = "0.22"
csv = "1.4"
kdl = "6.7.1"
landlock = "0.4.2"
regex = "1"
seccompiler = "0.5"
toml_edit = "0.22"
zbus = "5.12"

[[bin]]
name = "reginux-sandbox"
path = "src/bin/reginux-sandbox.rs"
