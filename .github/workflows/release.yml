name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to package, without the leading v
        required: true
        default: 1.0.0
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Resolve release version
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="$MANUAL_VERSION"
          else
            version="${TAG_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid stable release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        run: ./scripts/release.sh "${{ steps.release.outputs.version }}" "$RUNNER_TEMP/reginux-release"
      - name: Verify release artifacts
        run: ./scripts/verify-release.sh "$RUNNER_TEMP/reginux-release" "${{ steps.release.outputs.version }}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reginux-${{ steps.release.outputs.version }}-linux-${{ runner.arch }}
          path: ${{ runner.temp }}/reginux-release
          if-no-files-found: error
